name: tva

services:
  db:
    image: postgres:15
    container_name: tva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-tva-db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:latest
    container_name: tva-chroma
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tva-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 컨테이너 내부 통신은 서비스명으로 접근
      DB_HOST: db
      DB_PORT: 5432
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    depends_on:
      - db
      - chroma
    ports:
      - "8000:8000"
    volumes:
      # 업로드를 백엔드 컨테이너에 유지하고 싶으면 이 경로가 백엔드 코드와 맞아야 함
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: tva-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  chroma_data:
