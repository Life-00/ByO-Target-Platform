name: tva

services:
  db:
    image: postgres:15
    container_name: tva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-tva-db}
    ports:
      # 운영에서는 외부 노출 불필요. (서버 내부에서만 쓰려면 이대로)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    container_name: tva-chroma
    restart: unless-stopped
    ports:
      # 운영에서는 외부 노출 불필요. (서버 내부에서만 쓰려면 이대로)
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8000/api/v1/heartbeat >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: tva-backend
    build: ./backend
    container_name: tva-backend
    restart: unless-stopped
    environment:
      # ===== CORS =====
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}

      # ===== APP =====
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY}
      UPSTAGE_BASE_URL: ${UPSTAGE_BASE_URL}
      UPSTAGE_MODEL: ${UPSTAGE_MODEL}
      UPSTAGE_EMBED_MODEL: ${UPSTAGE_EMBED_MODEL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      # ===== DB =====
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE:-disable}

      # ===== CHROMA =====
      CHROMA_HOST: ${CHROMA_HOST:-chroma}
      CHROMA_PORT: ${CHROMA_PORT:-8000}

  frontend:
    image: tva-frontend
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: tva-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  chroma_data:
