# 1. Deployment: 실제 ChromaDB 컨테이너(Pod) 실행
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tva-chroma
  namespace: tva
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tva-chroma
  template:
    metadata:
      labels:
        app: tva-chroma
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:latest
          ports:
            - containerPort: 8000
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: PERSIST_DIRECTORY
              value: "/chroma/chroma"
          volumeMounts:
            - name: chromadb-data
              mountPath: /chroma/chroma
      volumes:
        - name: chromadb-data
          persistentVolumeClaim:
            claimName: chromadb-pvc

---
# 2. Service: 백엔드가 'tva-chroma'라는 이름으로 찾을 수 있게 함
apiVersion: v1
kind: Service
metadata:
  name: tva-chroma  # ConfigMap의 CHROMA_HOST와 일치!
  namespace: tva
spec:
  selector:
    app: tva-chroma
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP

---
# 3. PersistentVolumeClaim (PVC): 데이터 저장소 요청
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chromadb-pvc
  namespace: tva
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName: local-path  <-- Docker Desktop에서는 주석 처리 (기본값 사용)