apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tva-ingress
  namespace: tva
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"

    # [핵심 수정] 백엔드로 보낼 때 중간에 /v1 을 강제로 끼워넣음!
    # 예: /api/auth/signup  ->  /api/v1/auth/signup (백엔드로 전달)
    nginx.ingress.kubernetes.io/rewrite-target: /api/v1/$1
spec:
  rules:
    - host: localhost
      http:
        paths:
          # 1. API 요청 처리
          # /api/ 뒤에 오는 나머지(.*)를 캡처해서 $1에 담음
          - path: /api/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tva-backend
                port:
                  number: 8000

          # 2. 프론트엔드 처리
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tva-frontend
                port:
                  number: 80