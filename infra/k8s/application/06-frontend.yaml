# 1. Deployment: 프론트엔드(React+Nginx) 실행
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tva-frontend
  namespace: tva
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tva-frontend
  template:
    metadata:
      labels:
        app: tva-frontend
    spec:
      # [중요] 비공개 이미지 다운로드 권한 (백엔드와 동일)
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: frontend
          # [중요] 아래 {본인_깃허브_아이디_소문자}를 꼭 수정하세요!
          image: ghcr.io/life-00/tva-frontend:lite
          imagePullPolicy: Always
          ports:
            - containerPort: 80 # Nginx 기본 포트

          # 리소스 제한 (React 정적 파일 서빙은 가벼워서 적게 잡아도 됩니다)
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

          # 헬스 체크 (Nginx가 잘 떴는지 확인)
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
# 2. Service: 내부 통신용 (나중에 Ingress가 여기로 연결됨)
apiVersion: v1
kind: Service
metadata:
  name: tva-frontend
  namespace: tva
spec:
  selector:
    app: tva-frontend
  ports:
    - port: 80       # 서비스 포트
      targetPort: 80 # 컨테이너 포트
  type: ClusterIP