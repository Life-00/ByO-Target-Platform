[project]
name = "ai"
version = "0.1.0"
description = "PubMedQA Validator Agent System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langgraph>=0.0.10",
    "pydantic>=2.0.0",
    "biopython>=1.80",
    "typing-extensions>=4.0.0",
    "python-dotenv>=1.2.1",
    "langchain-upstage>=0.7.4",
    "chromadb>=1.4.0",
    "langsmith>=0.4.37",
]

[tool.setuptools]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
[tool.pytest.ini_options]
pythonpath = ["."]
