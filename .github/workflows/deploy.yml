name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            TARGET_DIR="workspace/TVA_test"
            cd $TARGET_DIR

            # 1. 코드 업데이트 (파일이 아닌 소스만 동기화)
            git fetch --all
            git reset --hard origin/main

            # 2. Secrets 값을 환경 변수로 불러와서 도커에 직접 주입
            # 파일 생성 단계 없이 바로 실행합니다.
            echo "[DEPLOY] Injecting Secrets directly into Docker..."

            VITE_API_BASE_URL="http://${{ secrets.EC2_HOST }}:8000/api/v1" \
            UPSTAGE_API_KEY="${{ secrets.UPSTAGE_API_KEY }}" \
            DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            UPSTAGE_BASE_URL="https://api.upstage.ai/v1" \
            UPSTAGE_MODEL="solar-pro2" \
            UPSTAGE_EMBED_MODEL="solar-embedding-1-large" \
            CHROMA_HOST="chroma" \
            CHROMA_PORT="8000" \
            docker compose up -d --build

            echo "[DEPLOY] Done. No .env files created on disk."
            docker ps
