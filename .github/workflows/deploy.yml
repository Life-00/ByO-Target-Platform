name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            TARGET_DIR="workspace/TVA_test"
            cd "$TARGET_DIR"

            echo "[DEPLOY] Pulling latest code..."
            git fetch --all
            git reset --hard origin/main

            # NOTE:
            # - docker compose down does NOT remove named volumes unless you pass -v
            # - we intentionally do NOT use -v so Postgres/Chroma data persists across redeploys
            echo "[DEPLOY] Stopping existing containers (keeping volumes)..."
            docker compose down --remove-orphans

            echo "[DEPLOY] Exporting secrets for docker compose..."
            export VITE_API_BASE_URL="http://${{ secrets.EC2_HOST }}:8000/api/v1"

            export UPSTAGE_API_KEY="${{ secrets.UPSTAGE_API_KEY }}"
            export UPSTAGE_BASE_URL="${{ secrets.UPSTAGE_BASE_URL }}"
            export UPSTAGE_MODEL="${{ secrets.UPSTAGE_MODEL }}"
            export UPSTAGE_EMBED_MODEL="${{ secrets.UPSTAGE_EMBED_MODEL }}"
            export JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"

            # DB (DATABASE_URL 사용 안 함)
            export DB_USER="${{ secrets.DB_USER }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export DB_NAME="${{ secrets.DB_NAME }}"
            export DB_HOST="db"
            export DB_PORT="5432"
            # docker-compose의 db 컨테이너는 기본 SSL 비활성
            export DB_SSLMODE="disable"

            # Chroma
            export CHROMA_HOST="chroma"
            export CHROMA_PORT="8000"

            echo "[DEPLOY] Building and starting containers..."
            docker compose up -d --build --remove-orphans

            echo "[DEPLOY] Cleaning up unused images..."
            docker image prune -af

            echo "[DEPLOY] Status check:"
            docker ps
