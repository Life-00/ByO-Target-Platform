name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            TARGET_DIR="workspace/TVA_test"
            cd $TARGET_DIR

            # 1. 코드 업데이트
            git fetch --all
            git reset --hard origin/main

            # 2. 기존 컨테이너 및 꼬인 환경 설정 삭제
            echo "[DEPLOY] Cleaning up old containers..."
            docker compose down

            # 3. 모든 값을 GitHub Secrets에서 셸 변수로 주입 (보안 최강화)
            echo "[DEPLOY] Injecting all secrets including DB info..."

            VITE_API_BASE_URL="http://${{ secrets.EC2_HOST }}:8000/api/v1" \
            UPSTAGE_API_KEY="${{ secrets.UPSTAGE_API_KEY }}" \
            UPSTAGE_BASE_URL="${{ secrets.UPSTAGE_BASE_URL }}" \
            UPSTAGE_MODEL="${{ secrets.UPSTAGE_MODEL }}" \
            UPSTAGE_EMBED_MODEL="${{ secrets.UPSTAGE_EMBED_MODEL }}" \
            DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            CHROMA_HOST="chroma" \
            CHROMA_PORT="8000" \
            DB_USER="${{ secrets.DB_USER }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            DB_HOST="${{ secrets.DB_HOST }}" \
            DB_PORT="${{ secrets.DB_PORT }}" \
            DB_NAME="${{ secrets.DB_NAME }}" \
            docker compose up -d --build --force-recreate

            # 4. 사용하지 않는 이미지 삭제 (용량 확보)
            echo "[DEPLOY] Removing unused images..."
            docker image prune -af

            echo "[DEPLOY] Done. Checking status:"
            docker ps
