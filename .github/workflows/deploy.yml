name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            TARGET_DIR="workspace/TVA_test"
            cd $TARGET_DIR

            # 1. 최신 코드 반영
            git fetch --all
            git reset --hard origin/main

            # 2. 기존의 꼬인 설정 제거 (환경 변수 갱신을 위해 필수)
            docker compose down

            # 3. Secrets를 런타임 변수로 주입하며 실행
            # 이 방식은 서버에 .env 파일을 남기지 않아 보안에 가장 좋습니다.
            VITE_API_BASE_URL="http://${{ secrets.EC2_HOST }}:8000/api/v1" \
            UPSTAGE_API_KEY="${{ secrets.UPSTAGE_API_KEY }}" \
            UPSTAGE_BASE_URL="https://api.upstage.ai/v1" \
            UPSTAGE_MODEL="solar-pro2" \
            UPSTAGE_EMBED_MODEL="solar-embedding-1-large" \
            DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            CHROMA_HOST="chroma" \
            CHROMA_PORT="8000" \
            DB_USER="postgres" \
            DB_PASSWORD="password" \
            DB_HOST="db" \
            DB_PORT="5432" \
            DB_NAME="tva_db" \
            docker compose up -d --build --force-recreate

            echo "[DEPLOY] Secrets successfully injected via Shell."
            docker ps
