name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            TARGET_DIR="workspace/TVA_test"
            cd $TARGET_DIR

            # 1. 소스코드 강제 동기화
            git fetch --all
            git reset --hard origin/main

            # 2. 기존의 꼬인 컨테이너와 네트워크 완전히 삭제 (핵심)
            docker compose down

            # 3. 빌드 캐시 삭제 (혹시 모를 이미지 꼬임 방지)
            docker system prune -f

            # 4. 환경 변수 주입하며 처음부터 다시 빌드 및 실행
            # 줄 끝에 \ 가 빠지면 안 됩니다!
            VITE_API_BASE_URL="http://${{ secrets.EC2_HOST }}:8000/api/v1" \
            UPSTAGE_API_KEY="${{ secrets.UPSTAGE_API_KEY }}" \
            UPSTAGE_BASE_URL="https://api.upstage.ai/v1" \
            UPSTAGE_MODEL="solar-pro2" \
            UPSTAGE_EMBED_MODEL="solar-embedding-1-large" \
            DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            CHROMA_HOST="chroma" \
            CHROMA_PORT="8000" \
            DB_USER="postgres" \
            DB_PASSWORD="password" \
            DB_HOST="db" \
            DB_PORT="5432" \
            DB_NAME="tva_db" \
            docker compose up -d --build --force-recreate

            echo "[DEPLOY] Done. Checking status..."
            docker ps
